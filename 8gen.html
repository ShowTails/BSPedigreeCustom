<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ShowTails 8 Generation Pedigree Explorer</title>

  <style>
    :root{
      --panel-text:#234a57;
      --panel-border:#d8d8d8;
      --panel-bg:rgba(255,255,255,0.97);
      --accent:#2f6fed;
      --male:#cce5ff;
      --female:#f8d7da;
      --empty:#bdbdbd;
      --duplicate:#ff2d2d;
    }

    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#fff;
      font-family:Arial, sans-serif;
    }

    #pedigree-container{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#fff;
      touch-action:none;
    }

    svg{
      display:block;
      width:100%;
      height:100%;
      background:#fff;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    .line{
      stroke:#555;
      stroke-width:1.4;
      fill:none;
      vector-effect:non-scaling-stroke;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .box{
      stroke:#000;
      stroke-width:1.2;
      vector-effect:non-scaling-stroke;
      cursor:pointer;
    }

    .male{ fill:var(--male); }
    .female{ fill:var(--female); }

    .empty-box{
      stroke:var(--empty) !important;
      stroke-dasharray:4 3;
    }

    .dim-empty .node.empty .box{ opacity:0.42; }
    .hidden-node{ display:none; }

    .box-name{
      font-weight:bold;
      fill:#000;
      pointer-events:none;
    }

    .box-text{
      fill:#000;
      pointer-events:none;
    }

    .box-badge{
      font-size:10px;
      font-weight:bold;
      fill:#234a57;
      pointer-events:none;
    }

    .duplicate .box{
      stroke:var(--duplicate) !important;
      stroke-width:2.8 !important;
      animation:flashDuplicateStroke 1s ease-in-out infinite;
    }

    @keyframes flashDuplicateStroke{
      0%,100%{ stroke:#ff2d2d; stroke-opacity:1; }
      50%{ stroke:#860000; stroke-opacity:.5; }
    }

    #toggle-panel-btn,
    #reset-view-btn{
      position:absolute;
      top:10px;
      z-index:20;
      padding:8px 14px;
      border:none;
      border-radius:7px;
      color:#fff;
      cursor:pointer;
      font-size:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    #toggle-panel-btn{ left:10px; background:#234a57; }
    #reset-view-btn{ right:10px; background:#4a4a4a; }

    #controls-panel{
      position:absolute;
      top:10px;
      left:10px;
      width:340px;
      max-height:calc(100vh - 20px);
      overflow:auto;
      background:var(--panel-bg);
      border:1px solid var(--panel-border);
      border-radius:10px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      z-index:21;
      padding:12px;
      color:var(--panel-text);
      transition:transform .22s ease, opacity .22s ease;
      transform:translateX(0);
      opacity:1;
      box-sizing:border-box;
    }

    #controls-panel.hidden{
      transform:translateX(-110%);
      opacity:0;
      pointer-events:none;
    }

    #panel-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    #panel-header h2{ margin:0; font-size:18px; }

    #close-panel-btn{
      border:1px solid #b9c4ca;
      background:#fff;
      color:#234a57;
      border-radius:6px;
      width:30px;
      height:30px;
      cursor:pointer;
      font-size:16px;
      line-height:1;
    }

    #controls-panel h3{
      margin:12px 0 6px;
      font-size:14px;
      color:#234a57;
    }

    .control-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-bottom:8px;
    }

    .btn{
      border:1px solid #b9c4ca;
      background:#fff;
      color:#234a57;
      border-radius:7px;
      padding:6px 10px;
      cursor:pointer;
      font-size:13px;
    }

    .btn.active{
      background:#234a57;
      color:#fff;
      border-color:#234a57;
    }

    .toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin:6px 0;
      font-size:13px;
      color:#234a57;
    }

    #summary-card,
    #duplicates-card{
      border:1px solid #d8d8d8;
      border-radius:8px;
      padding:8px;
      background:#fcfcfc;
      margin-top:8px;
    }

    .summary-line{
      font-size:12px;
      margin:4px 0;
      color:#234a57;
    }

    #duplicate-list{
      margin:6px 0 0 18px;
      padding:0;
      font-size:12px;
      color:#234a57;
    }

    #status-badge{
      position:absolute;
      bottom:10px;
      left:10px;
      z-index:18;
      background:rgba(255,255,255,.96);
      border:1px solid #d8d8d8;
      border-radius:8px;
      padding:7px 10px;
      font-size:12px;
      color:#234a57;
      max-width:calc(100vw - 260px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  </style>
</head>
<body>
  <div id="pedigree-container">
    <button id="toggle-panel-btn">Tools</button>

    <div id="controls-panel" class="hidden">
      <div id="panel-header">
        <h2>Pedigree Explorer</h2>
        <button id="close-panel-btn" type="button">✕</button>
      </div>

      <h3>Visible Generations</h3>
      <div class="control-row">
        <button class="btn gen-btn" data-gen="4">4 Gen</button>
        <button class="btn gen-btn" data-gen="6">6 Gen</button>
        <button class="btn gen-btn active" data-gen="8">8 Gen</button>
      </div>

      <h3>View Side</h3>
      <div class="control-row">
        <button class="btn side-btn active" data-side="all">All</button>
        <button class="btn side-btn" data-side="s">Sire Side</button>
        <button class="btn side-btn" data-side="d">Dam Side</button>
      </div>

      <h3>General Tools</h3>
      <div class="toggle">
        <label for="toggle-summary">Show summary</label>
        <input id="toggle-summary" type="checkbox" checked />
      </div>
      <div class="toggle">
        <label for="toggle-dim-empty">Dim empty boxes</label>
        <input id="toggle-dim-empty" type="checkbox" checked />
      </div>
      <div class="toggle">
        <label for="toggle-hide-empty">Hide empty boxes</label>
        <input id="toggle-hide-empty" type="checkbox" />
      </div>
      <div class="toggle">
        <label for="toggle-duplicates">Flash repeated rabbits</label>
        <input id="toggle-duplicates" type="checkbox" />
      </div>

      <div id="summary-card">
        <div class="summary-line"><strong>Relationship Summary</strong></div>
        <div class="summary-line" id="summary-duplicates">Repeated ancestors: 0</div>
        <div class="summary-line" id="summary-closest">Closest repeated generation: None</div>
        <div class="summary-line" id="summary-visible">Visible boxes: 0</div>
      </div>

      <div id="duplicates-card">
        <div class="summary-line"><strong>Repeated Ancestors</strong></div>
        <div class="summary-line" id="duplicates-help">No repeated ancestors detected.</div>
        <ul id="duplicate-list"></ul>
      </div>
    </div>

    <button id="reset-view-btn">Reset View</button>
    <div id="status-badge">Loading pedigree…</div>

    <svg id="pedigree-svg">
      <g id="viewport">
        <g id="lines-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
  </div>

  <script type="module">
    import * as glide from "https://esm.sh/@glideapps/tables";

    const URL_PARAMS = new URLSearchParams(window.location.search);

    const rabbitPedigreesTable = glide.table({
      token: "49dd5a59-6f0f-475f-9367-84b23c65d690",
      app: "8lcj30iX3DO7vjRtX1XK",
      table: "native-table-8e2dd118-8e06-40fa-a9de-2b78afe253b9",
      columns: {
        childRabbitId: { type: "string", name: "FlSJj" },
        owner: { type: "email-address", name: "9DUGU" },
        the8GenInfo: { type: "string", name: "ktZf7" }
      }
    });

    function getParam(name){ return URL_PARAMS.get(name) || ""; }
    function escapeText(value){ return String(value ?? ""); }
    function normalizeValue(value){ return String(value || "").toLowerCase().trim().replace(/\s+/g, " "); }

    function createSvgEl(tag, attrs = {}){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      return el;
    }

    function inferSexClass(path, explicitSex){
      if (explicitSex){
        const s = explicitSex.toLowerCase();
        if (s.startsWith("m") || s === "buck" || s === "sire") return "male";
        if (s.startsWith("f") || s === "doe" || s === "dam") return "female";
      }
      if (path === "") return "male";
      return path.endsWith("s") ? "male" : "female";
    }

    function buildRabbitKey(data){
      const name = normalizeValue(data.name);
      const ear = normalizeValue(data.ear);
      if (!name && !ear) return "";
      return `${name}||${ear}`;
    }

    function isEmptyRabbit(data){
      return ![
        data.rabbitry, data.name, data.color, data.ear, data.weight, data.sex,
        data.legs, data.reg, data.gc, data.dob, data.earLength, data.genetics,
        data.custom, data.win1, data.win2, data.win3
      ].some(value => String(value || "").trim());
    }

    function normalizePathKey(key){
      const k = String(key || "").trim().toLowerCase().replace(/^\/+|\/+$/g, "");
      if (!k || k === "c") return "";
      if (!/^[sd](\/[sd])*$/.test(k)) return null;
      return k.replace(/\//g, "");
    }

    function parsePackedRabbitString(raw){
      const result = {
        rabbitry:"", name:"", color:"", ear:"", weight:"", sex:"", legs:"",
        reg:"", gc:"", dob:"", earLength:"", genetics:"", custom:"",
        win1:"", win2:"", win3:""
      };

      if (typeof raw !== "string") return result;

      const lines = raw.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      let currentWin = "win1";

      for (const line of lines){
        if (!line) continue;
        const idx = line.indexOf(":");

        if (idx < 0){
          const extra = line.trim();
          if (!extra) continue;
          if (result[currentWin]) result[currentWin] += `\n${extra}`;
          else result[currentWin] = extra;
          continue;
        }

        const key = line.slice(0, idx).trim().toLowerCase();
        const value = line.slice(idx + 1).trim();

        switch (key){
          case "r": result.rabbitry = value; break;
          case "n": result.name = value; break;
          case "c": result.color = value; break;
          case "e": result.ear = value; break;
          case "w": result.weight = value; break;
          case "sx":
          case "sex": result.sex = value; break;
          case "l": result.legs = value; break;
          case "re": result.reg = value; break;
          case "g": result.gc = value; break;
          case "d": result.dob = value; break;
          case "el": result.earLength = value; break;
          case "ge": result.genetics = value; break;
          case "cu":
          case "custom": result.custom = value; break;
          case "w1": result.win1 = value; currentWin = "win1"; break;
          case "w2": result.win2 = value; currentWin = "win2"; break;
          case "w3": result.win3 = value; currentWin = "win3"; break;
        }
      }

      return result;
    }

    function parseInfoTextToNodeMap(text){
      const nodeMap = new Map();
      const raw = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const sectionRegex = /---\s*([cCsSdD](?:\s*\/\s*[sSdD])*)\s*---/g;
      const matches = Array.from(raw.matchAll(sectionRegex));

      for (let i = 0; i < matches.length; i++){
        const match = matches[i];
        const sectionKey = match[1];
        const start = match.index + match[0].length;
        const end = i + 1 < matches.length ? matches[i + 1].index : raw.length;
        const body = raw.slice(start, end).trim();
        const path = normalizePathKey(sectionKey);
        if (path === null) continue;
        nodeMap.set(path, parsePackedRabbitString(body));
      }

      return nodeMap;
    }

    function unwrapGlideValue(value){
      if (value === null || value === undefined) return "";
      if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") return String(value);
      if (typeof value === "object") {
        if (value.value !== undefined) return unwrapGlideValue(value.value);
        if (value.displayValue !== undefined) return unwrapGlideValue(value.displayValue);
        if (value.text !== undefined) return unwrapGlideValue(value.text);
        if (value.content !== undefined) return unwrapGlideValue(value.content);
      }
      return "";
    }

    function readGlideCell(row, keys){
      if (!row) return "";

      for (const key of keys){
        if (row[key] !== undefined) return unwrapGlideValue(row[key]);
      }

      const containers = [row.data, row.values, row.cells, row.columns, row._values, row._data];
      for (const container of containers){
        if (!container) continue;
        for (const key of keys){
          if (container[key] !== undefined) return unwrapGlideValue(container[key]);
        }
      }

      if (typeof row.get === "function") {
        for (const key of keys){
          try {
            const v = row.get(key);
            if (v !== undefined && v !== null && String(unwrapGlideValue(v)).trim()) return unwrapGlideValue(v);
          } catch (err) {}
        }
      }

      return "";
    }

    function getRowPedid(row){
      return readGlideCell(row, ["childRabbitId", "FlSJj"]);
    }

    function getRowEightGenInfo(row){
      return readGlideCell(row, ["the8GenInfo", "ktZf7"]);
    }

    function normalizeRows(result){
      if (Array.isArray(result)) return result;
      if (result && Array.isArray(result.rows)) return result.rows;
      if (result && Array.isArray(result.data)) return result.data;
      if (result && Array.isArray(result.items)) return result.items;
      return [];
    }

    async function loadPedigreeFromGlide(pedid){
      const cleanPedid = String(pedid || "").trim();
      if (!cleanPedid) throw new Error("Missing PEDID");

      let rows = [];
      let filteredLookupError = null;

      try {
        // Preferred: server-side / SDK-supported filtered lookup.
        rows = normalizeRows(await rabbitPedigreesTable.get(row => String(row.childRabbitId || row.FlSJj || "").trim() === cleanPedid));
      } catch (err) {
        filteredLookupError = err;
        console.warn("Filtered Glide lookup failed; falling back to full get().", err);
      }

      if (!rows.length) {
        const allRows = normalizeRows(await rabbitPedigreesTable.get());
        rows = allRows.filter(row => String(getRowPedid(row)).trim() === cleanPedid);

        if (!rows.length && allRows.length) {
          console.warn("No exact PEDID match after fallback. First row keys:", Object.keys(allRows[0] || {}), allRows[0]);
        }
      }

      const row = rows[0];
      if (!row) {
        const extra = filteredLookupError ? ` Filtered lookup error: ${filteredLookupError.message}` : "";
        throw new Error(`No pedigree found for PEDID ${cleanPedid}.${extra}`);
      }

      const info = getRowEightGenInfo(row);
      console.log("Glide pedigree row loaded", {
        pedid: cleanPedid,
        rowKeys: Object.keys(row || {}),
        childRabbitId: getRowPedid(row),
        infoLength: String(info || "").length,
        infoPreview: String(info || "").slice(0, 80)
      });

      if (!String(info || "").trim()) {
        throw new Error(`Pedigree row found, but the Gen 8 Info column is empty or could not be read for PEDID ${cleanPedid}. Check browser console for rowKeys.`);
      }

      return parseInfoTextToNodeMap(info);
    }

    async function loadInfoPayload(infoUrl){
      const response = await fetch(infoUrl, { credentials:"omit" });
      if (!response.ok) throw new Error(`Failed to load pedigree info (${response.status})`);
      const text = await response.text();
      return parseInfoTextToNodeMap(text);
    }

    function wrapTextLines(value, maxCharsPerLine){
      const rawLines = String(value || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      const output = [];
      rawLines.forEach(raw => {
        const line = raw.trim();
        if (!line) return;
        const words = line.split(/\s+/);
        let current = "";
        words.forEach(word => {
          const test = current ? `${current} ${word}` : word;
          if (test.length <= maxCharsPerLine) current = test;
          else {
            if (current) output.push(current);
            current = word;
          }
        });
        if (current) output.push(current);
      });
      return output;
    }

    function appendWrappedText(group, x, y, className, value, metrics, maxWidth, extraAttrs = {}){
      const approxChars = Math.max(8, Math.floor(maxWidth / (metrics.textSize * .58)));
      const lines = wrapTextLines(value, approxChars);
      if (!lines.length) return { lineCount:0, textEl:null };

      const textEl = createSvgEl("text", Object.assign({ x, y, class:className }, extraAttrs));
      lines.forEach((line, index) => {
        const tspan = createSvgEl("tspan", { x, dy:index === 0 ? 0 : metrics.lineHeight });
        tspan.textContent = line;
        textEl.appendChild(tspan);
      });
      group.appendChild(textEl);
      return { lineCount:lines.length, textEl };
    }

    function addFieldRow(rows, label, value){
      const clean = String(value || "").trim();
      if (clean) rows.push(`${label}: ${clean}`);
    }

    function getNodeDisplayRows(data, generation){
      const rows = [];
      if (generation <= 5){
        addFieldRow(rows, "Color", data.color);
        addFieldRow(rows, "Ear#", data.ear);
        addFieldRow(rows, "Weight", data.weight);
        addFieldRow(rows, "Sex", data.sex);
        addFieldRow(rows, "Legs", data.legs);
        addFieldRow(rows, "Reg#", data.reg);
        addFieldRow(rows, "GC#", data.gc);
        addFieldRow(rows, "DOB", data.dob);
        addFieldRow(rows, "Ear Length", data.earLength);
        addFieldRow(rows, "Genetics", data.genetics);
        addFieldRow(rows, "Custom", data.custom);
        addFieldRow(rows, "Win 1", data.win1);
        addFieldRow(rows, "Win 2", data.win2);
        addFieldRow(rows, "Win 3", data.win3);
        return rows;
      }
      if (generation <= 7){
        addFieldRow(rows, "Color", data.color);
        addFieldRow(rows, "Ear#", data.ear);
        addFieldRow(rows, "Weight", data.weight);
        addFieldRow(rows, "Reg#", data.reg);
        addFieldRow(rows, "GC#", data.gc);
        addFieldRow(rows, "DOB", data.dob);
        addFieldRow(rows, "Genetics", data.genetics);
        return rows;
      }
      addFieldRow(rows, "Ear#", data.ear);
      addFieldRow(rows, "Color", data.color);
      addFieldRow(rows, "GC#", data.gc);
      return rows;
    }

    function countWrappedLinesForRows(rows, metrics, usableWidth){
      const approxChars = Math.max(8, Math.floor(usableWidth / (metrics.textSize * .58)));
      let total = 0;
      rows.forEach(row => total += Math.max(1, wrapTextLines(row, approxChars).length));
      return total;
    }

    (async function(){
      const MAX_GENERATIONS = 8;
      const LAYOUT = {
        rootX:0,
        rootY:0,
        sideColumnX:{ 2:580, 3:1170, 4:1810, 5:2510, 6:3280, 7:4110, 8:5010 },
        leafGap:126,
        branchGap:26,
        padding:120,
        focusPadding:260
      };
      const BOX_SCALE = { 1:1, 2:.98, 3:.92, 4:.84, 5:.74, 6:.64, 7:.54, 8:.46 };
      const BASE_BOX_WIDTH = 292;
      const BASE_BOX_HEIGHT = 182;

      const state = {
        visibleGenerations:8,
        visibleSide:"all",
        showSummary:true,
        dimEmpty:true,
        hideEmpty:false,
        flashDuplicates:false,
        nodesByPath:new Map(),
        infoNodeMap:new Map(),
        duplicateGroups:new Map(),
        rendered:false,
        worldBounds:null,
        view:{ x:0, y:0, scale:.12, minScale:.03, maxScale:16 }
      };

      const container = document.getElementById("pedigree-container");
      const svg = document.getElementById("pedigree-svg");
      const viewport = document.getElementById("viewport");
      const linesLayer = document.getElementById("lines-layer");
      const nodesLayer = document.getElementById("nodes-layer");
      const statusBadge = document.getElementById("status-badge");
      const summaryCard = document.getElementById("summary-card");
      const duplicatesCard = document.getElementById("duplicates-card");
      const summaryDuplicates = document.getElementById("summary-duplicates");
      const summaryClosest = document.getElementById("summary-closest");
      const summaryVisible = document.getElementById("summary-visible");
      const duplicatesHelp = document.getElementById("duplicates-help");
      const duplicateList = document.getElementById("duplicate-list");

      function updateStatus(text){ statusBadge.textContent = text; }

      function getRabbitData(path){
        const rabbit = state.infoNodeMap.get(path) || {};
        return {
          rabbitry:escapeText(rabbit.rabbitry || ""),
          name:escapeText(rabbit.name || ""),
          color:escapeText(rabbit.color || ""),
          ear:escapeText(rabbit.ear || ""),
          weight:escapeText(rabbit.weight || ""),
          sex:escapeText(rabbit.sex || ""),
          legs:escapeText(rabbit.legs || ""),
          reg:escapeText(rabbit.reg || ""),
          gc:escapeText(rabbit.gc || ""),
          dob:escapeText(rabbit.dob || ""),
          earLength:escapeText(rabbit.earLength || ""),
          genetics:escapeText(rabbit.genetics || ""),
          custom:escapeText(rabbit.custom || ""),
          win1:escapeText(rabbit.win1 || ""),
          win2:escapeText(rabbit.win2 || ""),
          win3:escapeText(rabbit.win3 || "")
        };
      }

      function getNodeSide(path){ if (!path) return "root"; return path[0] === "s" ? "s" : "d"; }
      function getOrderWithinSide(path){
        const bits = path.slice(1).replace(/s/g, "0").replace(/d/g, "1");
        return bits ? parseInt(bits, 2) : 0;
      }
      function getMetrics(generation){
        const scale = BOX_SCALE[generation] || .46;
        return {
          width:BASE_BOX_WIDTH * scale,
          minHeight:BASE_BOX_HEIGHT * scale,
          nameSize:Math.max(8, 12 * scale),
          textSize:Math.max(7, 10 * scale),
          lineHeight:Math.max(9, 12 * scale),
          titleLineHeight:Math.max(10, 13 * scale),
          pad:Math.max(6, 8 * scale),
          corner:Math.max(7, 10 * scale)
        };
      }
      function getNodePosition(path){
        const generation = path.length + 1;
        if (generation === 1) return { xCenter:LAYOUT.rootX, yCenter:LAYOUT.rootY };
        const side = getNodeSide(path);
        const nodesInBand = Math.pow(2, generation - 2);
        const order = getOrderWithinSide(path);
        const bandHeight = Math.pow(2, 7 - (generation - 1)) * LAYOUT.leafGap;
        const top = -((nodesInBand * bandHeight) / 2);
        const centerY = top + (order * bandHeight) + (bandHeight / 2);
        const x = LAYOUT.sideColumnX[generation] || LAYOUT.sideColumnX[8];
        return { xCenter: side === "s" ? -x : x, yCenter:centerY };
      }

      function drawNode(path){
        const generation = path.length + 1;
        const pos = getNodePosition(path);
        const metrics = getMetrics(generation);
        const data = getRabbitData(path);
        const sexClass = inferSexClass(path, data.sex);
        const empty = isEmptyRabbit(data);
        const rabbitKey = buildRabbitKey(data);
        const title = [data.rabbitry, data.name].filter(Boolean).join(" ") || "—";
        const titleWidth = metrics.width - metrics.pad * 2;
        const titleApproxChars = Math.max(8, Math.floor(titleWidth / (metrics.nameSize * .56)));
        const titleLines = wrapTextLines(title, titleApproxChars);
        const rows = getNodeDisplayRows(data, generation);
        const usableWidth = metrics.width - metrics.pad * 2;
        const contentLineCount = countWrappedLinesForRows(rows, metrics, usableWidth);
        const titleBlockHeight = Math.max(1, titleLines.length) * metrics.titleLineHeight;
        const contentBlockHeight = contentLineCount * metrics.lineHeight;
        const boxHeight = Math.max(metrics.minHeight, metrics.pad * 2 + titleBlockHeight + (rows.length ? metrics.lineHeight * .6 : 0) + contentBlockHeight);
        const x = pos.xCenter - metrics.width / 2;
        const y = pos.yCenter - boxHeight / 2;

        const group = createSvgEl("g", { "data-path":path, "data-generation":String(generation), class:`node ${empty ? "empty" : ""}` });
        const rect = createSvgEl("rect", { x, y, width:metrics.width, height:boxHeight, rx:metrics.corner, ry:metrics.corner, class:`box ${sexClass} ${empty ? "empty-box" : ""}`, "data-slot":path });
        group.appendChild(rect);

        const badgeText = createSvgEl("text", { x:x + metrics.width - metrics.pad, y:y + metrics.pad + metrics.nameSize, class:"box-badge", "text-anchor":"end" });
        group.appendChild(badgeText);

        let cursorY = y + metrics.pad + metrics.nameSize;
        const titleText = createSvgEl("text", { x:x + metrics.pad, y:cursorY, class:"box-name", "font-size":metrics.nameSize });
        titleLines.forEach((line, index) => {
          const tspan = createSvgEl("tspan", { x:x + metrics.pad, dy:index === 0 ? 0 : metrics.titleLineHeight });
          tspan.textContent = line;
          titleText.appendChild(tspan);
        });
        group.appendChild(titleText);

        cursorY += Math.max(1, titleLines.length - 1) * metrics.titleLineHeight;
        cursorY += metrics.lineHeight;
        rows.forEach(row => {
          const result = appendWrappedText(group, x + metrics.pad, cursorY, "box-text", row, metrics, usableWidth, { "font-size":metrics.textSize });
          if (result.lineCount > 0) cursorY += result.lineCount * metrics.lineHeight;
        });

        nodesLayer.appendChild(group);
        state.nodesByPath.set(path, { path, generation, group, rect, badgeText, data, rabbitKey, empty, x, y, width:metrics.width, height:boxHeight, xCenter:pos.xCenter, yCenter:pos.yCenter });
      }

      function walkPaths(){
        const queue = [""];
        while (queue.length){
          const path = queue.shift();
          drawNode(path);
          const generation = path.length + 1;
          if (generation < MAX_GENERATIONS){
            queue.push(path + "s");
            queue.push(path + "d");
          }
        }
      }

      function computeWorldBounds(){
        const nodes = Array.from(state.nodesByPath.values());
        const minX = Math.min(...nodes.map(n => n.x)) - LAYOUT.padding;
        const minY = Math.min(...nodes.map(n => n.y)) - LAYOUT.padding;
        const maxX = Math.max(...nodes.map(n => n.x + n.width)) + LAYOUT.padding;
        const maxY = Math.max(...nodes.map(n => n.y + n.height)) + LAYOUT.padding;
        state.worldBounds = { minX, minY, maxX, maxY, width:maxX - minX, height:maxY - minY };
      }

      function computeDuplicateGroups(){
        state.duplicateGroups.clear();
        for (const node of state.nodesByPath.values()){
          if (!node.rabbitKey) continue;
          if (!state.duplicateGroups.has(node.rabbitKey)) state.duplicateGroups.set(node.rabbitKey, []);
          state.duplicateGroups.get(node.rabbitKey).push(node);
        }
        for (const [key, nodes] of Array.from(state.duplicateGroups.entries())){
          if (nodes.length < 2) state.duplicateGroups.delete(key);
        }
      }

      function isNodeVisible(path, node){
        if (node.generation > state.visibleGenerations) return false;
        if (state.visibleSide === "s" && path && !path.startsWith("s")) return false;
        if (state.visibleSide === "d" && path && !path.startsWith("d")) return false;
        if (state.hideEmpty && node.empty && node.generation > 1) return false;
        return true;
      }

      function getVisibleNodes(){
        const arr = [];
        for (const [path, node] of state.nodesByPath.entries()) if (isNodeVisible(path, node)) arr.push(node);
        return arr;
      }

      function clearLayer(layer){ while (layer.firstChild) layer.removeChild(layer.firstChild); }
      function getConnectorAnchor(node, side){ return side === "left" ? { x:node.x - 6, y:node.yCenter } : { x:node.x + node.width + 6, y:node.yCenter }; }
      function drawPath(d, cls){ return createSvgEl("path", { d, class:cls }); }

      function rebuildVisibleBranchLines(){
        clearLayer(linesLayer);
        const root = state.nodesByPath.get("");
        if (!root || !isNodeVisible("", root)) return;

        function drawParentChild(parentNode, childNode){
          const side = getNodeSide(childNode.path);
          const parentAnchor = side === "s" ? getConnectorAnchor(parentNode, "left") : getConnectorAnchor(parentNode, "right");
          const childAnchor = side === "s" ? getConnectorAnchor(childNode, "right") : getConnectorAnchor(childNode, "left");
          const branchX = side === "s" ? Math.max(childAnchor.x, parentAnchor.x - 30) : Math.min(childAnchor.x, parentAnchor.x + 30);
          const d = `M ${parentAnchor.x} ${parentAnchor.y} L ${branchX} ${parentAnchor.y} L ${branchX} ${childAnchor.y} L ${childAnchor.x} ${childAnchor.y}`;
          linesLayer.appendChild(drawPath(d, "line"));
        }

        function drawParentTwoChildren(parentNode, childS, childD){
          const side = getNodeSide(childS.path);
          const parentAnchor = side === "s" ? getConnectorAnchor(parentNode, "left") : getConnectorAnchor(parentNode, "right");
          const a1 = side === "s" ? getConnectorAnchor(childS, "right") : getConnectorAnchor(childS, "left");
          const a2 = side === "s" ? getConnectorAnchor(childD, "right") : getConnectorAnchor(childD, "left");
          const top = a1.y < a2.y ? a1 : a2;
          const bottom = a1.y < a2.y ? a2 : a1;
          const branchX = side === "s" ? Math.max(a1.x, a2.x) + LAYOUT.branchGap : Math.min(a1.x, a2.x) - LAYOUT.branchGap;
          const d = `M ${parentAnchor.x} ${parentAnchor.y} L ${branchX} ${parentAnchor.y} L ${branchX} ${top.y} M ${branchX} ${top.y} L ${top.x} ${top.y} M ${branchX} ${bottom.y} L ${bottom.x} ${bottom.y} M ${branchX} ${top.y} L ${branchX} ${bottom.y}`;
          linesLayer.appendChild(drawPath(d, "line"));
        }

        for (const [path, parentNode] of state.nodesByPath.entries()){
          if (parentNode.generation >= MAX_GENERATIONS) continue;
          if (!isNodeVisible(path, parentNode)) continue;
          const childS = state.nodesByPath.get(path + "s");
          const childD = state.nodesByPath.get(path + "d");
          const showS = !!childS && isNodeVisible(childS.path, childS);
          const showD = !!childD && isNodeVisible(childD.path, childD);
          if (showS && showD) drawParentTwoChildren(parentNode, childS, childD);
          else if (showS) drawParentChild(parentNode, childS);
          else if (showD) drawParentChild(parentNode, childD);
        }
      }

      function calculateCloseness(visibleNodes){
        const visibleSet = new Set(visibleNodes.map(n => n.path));
        let repeatedAncestors = 0;
        let closestGeneration = null;
        const duplicateItems = [];
        for (const group of state.duplicateGroups.values()){
          const visibleGroup = group.filter(node => visibleSet.has(node.path));
          if (visibleGroup.length > 1){
            repeatedAncestors++;
            const nearest = Math.min(...visibleGroup.map(node => node.generation));
            if (closestGeneration === null || nearest < closestGeneration) closestGeneration = nearest;
            const first = visibleGroup[0];
            duplicateItems.push({ key:first.rabbitKey, label:`${first.data.name || "Unnamed"} (${first.data.ear || "No Ear#"})`, count:visibleGroup.length, closest:nearest });
          }
        }
        duplicateItems.sort((a,b) => a.closest - b.closest || b.count - a.count || a.label.localeCompare(b.label));
        return { repeatedAncestors, closestGeneration, duplicateItems };
      }

      function updateDuplicateHighlights(visibleNodes){
        const visibleSet = new Set(visibleNodes.map(n => n.path));
        for (const node of state.nodesByPath.values()){
          node.group.classList.remove("duplicate");
          node.badgeText.textContent = "";
        }
        for (const group of state.duplicateGroups.values()){
          const visibleGroup = group.filter(node => visibleSet.has(node.path));
          if (visibleGroup.length > 1){
            visibleGroup.forEach(node => {
              node.badgeText.textContent = `×${visibleGroup.length}`;
              if (state.flashDuplicates) node.group.classList.add("duplicate");
            });
          }
        }
      }

      function updateSummary(visibleNodes){
        const result = calculateCloseness(visibleNodes);
        summaryDuplicates.textContent = `Repeated ancestors: ${result.repeatedAncestors}`;
        summaryClosest.textContent = `Closest repeated generation: ${result.closestGeneration || "None"}`;
        summaryVisible.textContent = `Visible boxes: ${visibleNodes.length}`;
        duplicateList.innerHTML = "";
        if (!result.duplicateItems.length) duplicatesHelp.textContent = "No repeated ancestors detected.";
        else {
          duplicatesHelp.textContent = `${result.duplicateItems.length} repeated ancestor group(s) detected.`;
          result.duplicateItems.slice(0, 20).forEach(item => {
            const li = document.createElement("li");
            li.textContent = `${item.label} • ×${item.count} • nearest gen ${item.closest}`;
            duplicateList.appendChild(li);
          });
        }
        const display = state.showSummary ? "block" : "none";
        summaryCard.style.display = display;
        duplicatesCard.style.display = display;
      }

      function updateVisibility(){
        let visibleCount = 0;
        for (const [path, node] of state.nodesByPath.entries()){
          const visible = isNodeVisible(path, node);
          node.group.classList.toggle("hidden-node", !visible);
          if (visible) visibleCount++;
        }
        rebuildVisibleBranchLines();
        return visibleCount;
      }

      function applyTransform(){ viewport.setAttribute("transform", `translate(${state.view.x}, ${state.view.y}) scale(${state.view.scale})`); }

      function getVisibleBounds(){
        const nodes = getVisibleNodes();
        if (!nodes.length){
          const root = state.nodesByPath.get("");
          return { minX:root.x - 60, minY:root.y - 60, maxX:root.x + root.width + 60, maxY:root.y + root.height + 60 };
        }
        return {
          minX:Math.min(...nodes.map(n => n.x)) - 80,
          minY:Math.min(...nodes.map(n => n.y)) - 80,
          maxX:Math.max(...nodes.map(n => n.x + n.width)) + 80,
          maxY:Math.max(...nodes.map(n => n.y + n.height)) + 80
        };
      }

      function getRootFocusBounds(){
        const nodes = ["", "s", "d"].map(p => state.nodesByPath.get(p)).filter(Boolean);
        return {
          minX:Math.min(...nodes.map(n => n.x)) - LAYOUT.focusPadding,
          minY:Math.min(...nodes.map(n => n.y)) - LAYOUT.focusPadding,
          maxX:Math.max(...nodes.map(n => n.x + n.width)) + LAYOUT.focusPadding,
          maxY:Math.max(...nodes.map(n => n.y + n.height)) + LAYOUT.focusPadding
        };
      }

      function fitBounds(bounds, maxScaleOverride){
        const width = bounds.maxX - bounds.minX;
        const height = bounds.maxY - bounds.minY;
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        let scale = Math.min(cw / width, ch / height) * .94;
        scale = Math.max(state.view.minScale, Math.min(maxScaleOverride || state.view.maxScale, scale));
        state.view.scale = scale;
        state.view.x = cw / 2 - ((bounds.minX + bounds.maxX) / 2) * scale;
        state.view.y = ch / 2 - ((bounds.minY + bounds.maxY) / 2) * scale;
        applyTransform();
      }

      function centerOnRoot(){ fitBounds(getRootFocusBounds(), 5); }
      function fitCurrentGenerationView(){ fitBounds(getVisibleBounds()); }

      function applyState(){
        if (!state.rendered) return;
        document.body.classList.toggle("dim-empty", state.dimEmpty);
        const visibleCount = updateVisibility();
        const visibleNodes = getVisibleNodes();
        updateDuplicateHighlights(visibleNodes);
        updateSummary(visibleNodes);
        updateStatus(`Ready • Visible: ${visibleCount} • Gen: ${state.visibleGenerations} • Side: ${state.visibleSide === "all" ? "All" : state.visibleSide === "s" ? "Sire" : "Dam"}`);
      }

      function renderPedigree(){
        updateStatus("Rendering pedigree...");
        walkPaths();
        computeWorldBounds();
        computeDuplicateGroups();
        state.rendered = true;
        applyState();
        centerOnRoot();
        updateStatus(`Ready • ${state.nodesByPath.size} boxes • 8 generations`);
      }

      function wirePanZoom(){
        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        function zoomAt(clientX, clientY, nextScale){
          const rect = svg.getBoundingClientRect();
          const px = clientX - rect.left;
          const py = clientY - rect.top;
          const worldX = (px - state.view.x) / state.view.scale;
          const worldY = (py - state.view.y) / state.view.scale;
          state.view.scale = Math.max(state.view.minScale, Math.min(state.view.maxScale, nextScale));
          state.view.x = px - worldX * state.view.scale;
          state.view.y = py - worldY * state.view.scale;
          applyTransform();
        }
        svg.addEventListener("wheel", e => {
          e.preventDefault();
          const factor = e.deltaY > 0 ? .88 : 1.14;
          zoomAt(e.clientX, e.clientY, state.view.scale * factor);
        }, { passive:false });
        svg.addEventListener("pointerdown", e => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          try { svg.setPointerCapture(e.pointerId); } catch (err) {}
        });
        svg.addEventListener("pointermove", e => {
          if (!dragging) return;
          state.view.x += e.clientX - lastX;
          state.view.y += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          applyTransform();
        });
        function endDrag(){ dragging = false; }
        svg.addEventListener("pointerup", endDrag);
        svg.addEventListener("pointercancel", endDrag);
        svg.addEventListener("pointerleave", endDrag);
      }

      function wireInteractions(){
        const controlsPanel = document.getElementById("controls-panel");
        document.getElementById("toggle-panel-btn").addEventListener("click", () => controlsPanel.classList.remove("hidden"));
        document.getElementById("close-panel-btn").addEventListener("click", () => controlsPanel.classList.add("hidden"));
        document.getElementById("reset-view-btn").addEventListener("click", centerOnRoot);

        nodesLayer.addEventListener("click", e => {
          const box = e.target.closest(".box");
          if (!box) return;
          const slot = box.getAttribute("data-slot") || "";
          box.setAttribute("stroke", "#00aaff");
          setTimeout(() => box.setAttribute("stroke", ""), 250);
          window.parent.postMessage({ pedigreeEdit: slot || "c" }, "*");
        });

        document.querySelectorAll(".gen-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".gen-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            state.visibleGenerations = Number(btn.dataset.gen);
            applyState();
            fitCurrentGenerationView();
          });
        });

        document.querySelectorAll(".side-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".side-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            state.visibleSide = btn.dataset.side;
            applyState();
            fitCurrentGenerationView();
          });
        });

        document.getElementById("toggle-summary").addEventListener("change", e => { state.showSummary = e.target.checked; applyState(); });
        document.getElementById("toggle-dim-empty").addEventListener("change", e => { state.dimEmpty = e.target.checked; applyState(); });
        document.getElementById("toggle-hide-empty").addEventListener("change", e => { state.hideEmpty = e.target.checked; applyState(); fitCurrentGenerationView(); });
        document.getElementById("toggle-duplicates").addEventListener("change", e => { state.flashDuplicates = e.target.checked; applyState(); });
      }

      const ro = new ResizeObserver(() => { if (state.rendered) applyTransform(); });
      ro.observe(container);
      wirePanZoom();
      wireInteractions();

      try {
        const pedid = getParam("PEDID");
        const infoUrl = getParam("Info");

        if (pedid){
          updateStatus(`Loading pedigree from Glide API for PEDID ${pedid}...`);
          state.infoNodeMap = await loadPedigreeFromGlide(pedid);
        } else if (infoUrl){
          updateStatus("Loading pedigree from Info URL...");
          state.infoNodeMap = await loadInfoPayload(infoUrl);
        } else {
          state.infoNodeMap = new Map();
        }

        renderPedigree();
      } catch (err){
        console.error(err);
        updateStatus(`Failed to load pedigree info: ${err.message}`);
      }
    })();
  </script>
</body>
</html>
